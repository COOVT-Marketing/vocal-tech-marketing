<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCPA Tool Tester</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 24px; border-radius: 12px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; color: #38bdf8; font-size: 20px; }
    label { font-size: 12px; color: #94a3b8; font-weight: bold; display: block; margin-top: 12px; }
    input { width: 100%; padding: 10px; margin-top: 4px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 12px; margin-top: 16px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0369a1; }
    pre { background: #0f172a; padding: 12px; border-radius: 6px; border: 1px solid #334155; font-size: 12px; color: #4ade80; overflow-x: auto; max-height: 200px; }
  </style>
</head>
<body>

<div class="card">
  <h2>TCPA API Test Portal</h2>
  
  <label>API Endpoint</label>
  <input type="text" id="endpoint" value="https://tcpa-tools.azurewebsites.net/api/check" />

  <label>API Key</label>
  <input type="text" id="apiKey" value="cbee2905-8e42-4548-875a-392a28c0404e" />

  <label>Phone Number To Check</label>
  <input type="text" id="phone" value="1234567890" />

  <button onclick="testApi()">Send Request</button>

  <label>Response Status</label>
  <div id="status" style="margin-top: 4px; font-weight: bold;">-</div>

  <label>JSON Output</label>
  <pre id="output">// Response will appear here...</pre>
</div>

<script>
async function testApi() {
  const endpoint = document.getElementById('endpoint').value;
  const apiKey = document.getElementById('apiKey').value;
  const phone = document.getElementById('phone').value;
  const outputEl = document.getElementById('output');
  const statusEl = document.getElementById('status');

  outputEl.textContent = 'Testing...';
  statusEl.textContent = 'Sending...';
  statusEl.style.color = '#38bdf8';

  try {
    const response = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        phoneNumber: phone,
        phone: phone,
        apiKey: apiKey
      })
    });

    statusEl.textContent = `${response.status} ${response.statusText}`;
    statusEl.style.color = response.ok ? '#4ade80' : '#f87171';

    const data = await response.json().catch(() => null) || await response.text();
    outputEl.textContent = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;

  } catch (err) {
    statusEl.textContent = 'Request Failed (CORS / Network Error)';
    statusEl.style.color = '#f87171';
    outputEl.textContent = err.toString();
  }
}
</script>

</body>
</html>
